<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Desempeño - Sistema IA</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/formularios.css">
</head>

<body>
    <div id="navbar-container"></div>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1>Historial de Desempeño</h1>
                    <p class="subtitle">Antecedentes históricos de cumplimiento y calidad por proveedor.</p>
                </div>
                <button class="btn btn-primary" id="btn-nueva-experiencia">+ Registrar Experiencia</button>
            </div>

            <div class="card mb-1">
                <div class="card-header">
                    <h2>Métricas agregadas por proveedor</h2>
                </div>
                <div class="card-body">
                    <div class="form-grid" style="align-items:end;">
                        <div class="form-group">
                            <label>Proveedor</label>
                            <select id="select-metrica-proveedor">
                                <option value="">Selecciona un proveedor…</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <button class="btn btn-secondary" id="btn-consultar-metricas">Consultar métricas</button>
                        </div>
                    </div>
                    <div id="metricas-proveedor-resultado"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Experiencias registradas</h2>
                </div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Proveedor</th>
                                <th>Fecha operación</th>
                                <th>Cumplimiento</th>
                                <th>Entrega prom.</th>
                                <th>Productos</th>
                                <th class="text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="historial-body">
                            <tr><td colspan="6"><div class="loading-state"><div class="spinner"></div><span>Cargando historial...</span></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="modal-root"></div>
    <div id="chat-container"></div>

    <script src="../js/api.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/modal.js"></script>
    <script src="../js/components/chat.js"></script>
    <script src="../js/desempeno.js"></script>
</body>

</html>
