<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Sistema IA</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/formularios.css">
</head>

<body>
    <div class="app-shell">
        <div id="sidebar-container"></div>
        <div class="app-main">
            <div id="navbar-container"></div>
            <main class="content-area">
                <div class="page-header">
                    <div>
                        <div class="eyebrow">Procurement</div>
                        <h1>Productos</h1>
                        <p class="subtitle">Catálogo de productos evaluables y los proveedores que los ofrecen.</p>
                    </div>
                    <div class="page-header-actions">
                        <button class="btn btn-primary" id="btn-nuevo-producto"><span data-icon="plus" data-icon-size="15"></span>Nuevo producto</button>
                    </div>
                </div>

                <div class="card">
                    <div class="filter-bar">
                        <div class="search-input">
                            <span data-icon="search" data-icon-size="16"></span>
                            <input type="search" id="search-productos" placeholder="Buscar por nombre o código…" aria-label="Buscar productos">
                        </div>
                        <select class="filter-select" id="filtro-estado-producto">
                            <option value="">Todos los estados</option>
                            <option value="Activo">Activo</option>
                            <option value="Inactivo">Inactivo</option>
                        </select>
                        <div class="filter-bar-spacer"></div>
                        <span class="result-count" id="result-count"></span>
                    </div>
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Nombre</th>
                                    <th>Descripción</th>
                                    <th>Estado</th>
                                    <th class="text-right">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="productos-body">
                                <tr class="skeleton-row"><td colspan="5"><div class="skeleton skeleton-line w-60"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="productos-pagination"></div>
                </div>
            </main>
        </div>
    </div>

    <div id="modal-root"></div>
    <div id="chat-container"></div>

    <script src="../js/components/icons.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/components/ui.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/modal.js"></script>
    <script src="../js/components/chat.js"></script>
    <script src="../js/productos.js"></script>
</body>

</html>
