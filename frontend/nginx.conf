# Sirve el frontend estático y reenvía la API al contenedor del backend.
# El navegador solo habla con este servidor (mismo origen), así que no hace
# falta CORS ni publicar el puerto del backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # El limitador de uso del asistente toma la IP del cliente de la
        # última entrada de X-Forwarded-For.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    # Documentación interactiva de la API (Swagger).
    location /docs {
        proxy_pass http://backend:8000;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
